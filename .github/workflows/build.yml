name: Build and push image

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get image name and Node.js version
        id: meta
        run: |
          VERSION=$(grep -oP 'LABEL\s+version="\K[^"]+' Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "Could not find LABEL version in Dockerfile" && exit 1
          fi
          # ghcr.io image names must be lowercase
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/node-ptero"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE:$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
